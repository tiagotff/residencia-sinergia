[project]
name = "sinergia"
version = "0.1.0"
description = "Solução multiagente de IA para bem-estar do colaborador"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langgraph",
    "langchain",
    "langchain-groq",
    "langchain-postgres",
    "crewai",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "apscheduler",
    "argon2-cffi",
    "pyjwt",
    "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "torch", "jupyter"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
