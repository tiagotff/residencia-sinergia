services:
  db:
    image: pgvector/pgvector:pg16
    container_name: residencia-sinergia-db-1
    environment:
      POSTGRES_USER: sinergia
      POSTGRES_PASSWORD: sinergia
      POSTGRES_DB: sinergia
    ports:
      - "5432:5432"
    volumes:
      - pg_sinergia_data:/var/lib/postgresql/data

  icd-api:
    image: whoicd/icd-api
    container_name: residencia-sinergia-icd-api-1
    environment:
      acceptLicense: "true"
      saveAnalytics: "false"
      include: "2026-01_pt"
    ports:
      - "8088:80"
    volumes:
      - icd_api_data:/app/data

volumes:
  pg_sinergia_data:
  icd_api_data:
